# 安装：pre-commit install（default_install_hook_types 会一次装齐三种钩子）
#
# 三层，越往后越贵，每层拦下一层拦不住的东西：
# - commit-msg：提交标题格式，毫秒级
# - pre-commit：排版本次改动的文件并重新暂存，再类型检查，十秒级
# - pre-push：与 CI 同一条 `bun run ci`（format → typecheck → test → build → 开发冒烟）
#
# 临时跳过某一步：SKIP=format,typecheck git commit ...
default_install_hook_types: [commit-msg, pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: commit-msg-format
        name: 校验提交标题格式
        entry: python scripts/check-commit-msg.py
        language: python
        stages: [commit-msg]

      - id: format
        name: 排版本次改动的文件并重新暂存
        entry: bun scripts/format-staged.mjs
        language: system
        files: \.(ts|tsx|mjs|js|cjs|css|json)$
        pass_filenames: false
        stages: [pre-commit]

      - id: typecheck
        name: 类型检查
        entry: bun run typecheck
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: verify-before-push
        name: 推送前完整校验（构建与开发冒烟，与 CI 相同）
        entry: bun run verify:push
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: no-push-main
        name: 禁止直接推送 main
        entry: python scripts/check-push-branch.py
        language: python
        pass_filenames: false
        stages: [pre-push]
