# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 的审查行为以本文件为准，优先级高于 app.coderabbit.ai 上的界面设置。
language: en-US
reviews:
  profile: assertive
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
  path_filters:
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/coverage/**"
    - "!**/dist/**"
    - "!.tmp/**"
    - "!.worktrees/**"
    - "!bun.lock"
