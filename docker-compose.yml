# Turnkey local deployment. See docs/docker.md for what each setting does.
#
#   OMPDESK_PASSWORD='a-long-random-password' \
#   OMP_UID=$(id -u) OMP_GID=$(id -g) docker compose up --build
#
# OMP_UID/OMP_GID rather than UID/GID because UID is readonly in bash and
# cannot be set inline.
services:
  ompdesk:
    build:
      context: .
      args:
        # Bind mounts keep host ownership; build the image for the user that
        # owns ~/.omp and the checkouts under OMPDESK_WORKSPACE.
        UID: ${OMP_UID:-1000}
        GID: ${OMP_GID:-1000}
    image: ompdesk:local
    # Loopback only. ompdesk can run a high-privilege agent; docs/deployment.md
    # explains why publishing this on 0.0.0.0 is not an option.
    ports:
      - "127.0.0.1:${OMPDESK_PORT:-30141}:30141"
    environment:
      OMPDESK_AUTHENTICATED: "1"
      OMPDESK_PASSWORD: ${OMPDESK_PASSWORD:?set OMPDESK_PASSWORD to the password the browser should ask for}
    volumes:
      # The same directory the omp CLI writes: sessions, config and model roles
      # are shared with the terminal.
      - ${OMP_HOME:-${HOME}/.omp}:/home/omp/.omp
      # The projects ompdesk may open. Narrow this to the tree you want the
      # agent to reach.
      - ${OMPDESK_WORKSPACE:-.}:/workspace
    restart: unless-stopped
