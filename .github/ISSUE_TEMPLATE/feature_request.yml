name: 功能请求
description: 提出新功能或对现有流程的改进；采纳与否会在本 issue 回复
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: 想要什么
      description: 描述希望增加或改变的界面、流程或行为。
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 现在卡在哪里
      description: 说明当前做法为什么不够用，尽量给出真实的使用场景。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
      description: 可选。

  - type: textarea
    id: context
    attributes:
      label: 附加信息
      description: 可选。截图、参考实现、相关 issue 或资料链接。
