name: Release package

# 发版命令推出 `v*` 标签后由这里出包：构建、打成 tgz、在标签上建 GitHub Release 并附上
# tgz 与校验和。npm 发布是另一条通道（publish-npm.yml）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: 要打包的标签
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build tarball and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 与 ci.yml 保持一致：bun.lock 是 lockfileVersion 2，1.3.x 读不了它。
          bun-version: "1.4.2"

      - name: Verify tag matches package version
        shell: bash
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          tag_version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "标签 $TAG 与 package.json 版本 $package_version 不一致" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Pack tarball
        run: mkdir -p dist && npm pack --pack-destination dist

      # 用「下载后安装」这条路本身验证产物：装进临时项目，起服务并请求首页。
      - name: Verify the tarball installs and serves
        shell: bash
        run: |
          tgz="$PWD/$(ls dist/*.tgz)"
          mkdir -p .tmp/pack-check/consumer
          cd .tmp/pack-check/consumer
          printf '{"name":"pack-check","private":true}\n' > package.json
          bun add "$tgz"
          export PI_CODING_AGENT_DIR="$PWD/agent"
          ./node_modules/.bin/ompdesk --no-open -p 30198 > server.log 2>&1 &
          pid=$!
          code=""
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:30198/ || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "首页返回 $code"
            cat server.log
            exit 1
          fi

      - name: Generate checksums
        run: sha256sum dist/*.tgz > dist/SHA256SUMS.txt

      - name: Generate release notes
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: bun scripts/release.ts notes "$TAG" > release-notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" dist/*.tgz dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.tgz dist/SHA256SUMS.txt \
              --verify-tag --title "$TAG" --notes-file release-notes.md
          fi
