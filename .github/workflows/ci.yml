name: CI

# Guards the release pipeline: publish-npm.yml runs `bun install --frozen-lockfile`,
# so a pull request that changes package.json without refreshing bun.lock breaks the
# npm publish only after the tag has already been pushed. Catch it on the pull request.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    # 冒烟步骤自己会起 dev server，最坏情况下要在启动超时与两次请求超时后收尾；
    # 给 job 一个上限，避免挂起的进程一直占着 runner。
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # engines.bun requires >=1.3.14: the omp SDK ships TypeScript that
          # imports `bun:` builtins, so an older Bun cannot serve the API routes.
          # bun.lock is text lockfile v2, which Bun 1.3 cannot parse.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 流水线只在 package.json 的 `ci` 脚本里定义一次（format → typecheck → test →
      # build → smoke:dev）；本地 `bun run verify` 与推送前钩子用的是同一份定义，改流程
      # 只改那一处，CI 与本地不会再分叉。
      #
      # 第一步排版是写入模式：只改写不判定，排版差异不会让 CI 失败。需要单独的判定用
      # `bun run format:check`。
      #
      # eslint 不进这道门禁：全仓 `bun run lint` 现有存量 error（React 编译器的
      # memoization 检查，落在 components/ 与 hooks/），加进来必然红。复现命令
      # `bun run lint`；改动本身仍要求范围内的 eslint 无 error，例如
      # `bunx eslint test-support lib`。
      #
      # 不新增 Windows 作业：路径分隔符、重命名与删除的句柄竞争这些 Windows 专属分支
      # 在这里没有回归保护，仍需在 Windows 本地手工跑 `bun test` 验证（见 PR 描述）。
      #
      # 最后一步会真实启动 dev server 请求首页与一个 API 路由：`bun run build` 只编译
      # 生产图谱，开发图谱里把 node: 内置模块带进 edge 或浏览器产物的错误能绕开它，
      # 表现成页面 500；冒烟失败时打印编译日志。
      - name: Verify (typecheck, tests, build, dev smoke)
        run: bun run ci
