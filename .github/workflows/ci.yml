name: CI

# Guards the release pipeline: publish-npm.yml runs `bun install --frozen-lockfile`,
# so a pull request that changes package.json without refreshing bun.lock breaks the
# npm publish only after the tag has already been pushed. Catch it on the pull request.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    # 冒烟步骤自己会起 dev server，最坏情况下要在启动超时与两次请求超时后收尾；
    # 给 job 一个上限，避免挂起的进程一直占着 runner。
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # 覆盖率门禁要与合并目标分支求分叉点（git merge-base origin/main HEAD）。
          # 浅克隆只有一个提交，分叉点取不到；改名识别同样依赖历史。
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # engines.bun requires >=1.3.14: the omp SDK ships TypeScript that
          # imports `bun:` builtins, so an older Bun cannot serve the API routes.
          # bun.lock is text lockfile v2, which Bun 1.3 cannot parse.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 流水线只在 package.json 的 `ci` 脚本里定义一次（typecheck → test →
      # coverage:gate → build → smoke:dev）；本地 `bun run verify` 与推送前钩子用的是
      # 同一份定义，改流程只改那一处，CI 与本地不会再分叉。`lib/coverage-gate/`
      # 里有一条测试直接读这份工作流与 package.json，锁住「这里只调用一个入口」与
      # 步骤顺序：静态检查排在最前，构建与冒烟排在最后，任一步失败都不再往下跑。
      #
      # 两次测试运行是刻意的，不合并：
      #
      # - `test` 是「测试是否通过」的判据，不开覆盖率插桩，失败信息与本地 `bun test`
      #   完全一致；
      # - `coverage:gate` 跑的是带插桩的全套测试，产物 lcov 与分叉点基准运行必须是同
      #   一条命令，否则两侧函数计数不可比。
      #
      # 合并成一次会让「测试失败」与「覆盖率判定」互相绑架：插桩后的失败信息与本地
      # 不一致，基准运行也失去了独立可比的对侧命令。所以保留两次，代价是约一次测试
      # 运行的时间。
      #
      # coverage:gate 的三段耗时（本次测试运行、基准运行、分析）由报告自己打印，合计
      # 超过 3 分钟时报告里单独说明超出量。规则有判定结果时这一步以非零退出码结束，
      # 合并检查随之变红；本地单独复现用 `bun run coverage:gate`。
      #
      # eslint 不进这道门禁：全仓 `bun run lint` 现有存量 error（React 编译器的
      # memoization 检查，落在 components/ 与 hooks/），加进来必然红。复现命令
      # `bun run lint`；改动本身仍要求范围内的 eslint 无 error，例如
      # `bunx eslint test-support lib`。
      #
      # 不新增 Windows 作业：路径分隔符、重命名与删除的句柄竞争这些 Windows 专属分支
      # 在这里没有回归保护，仍需在 Windows 本地手工跑 `bun test` 验证（见 PR 描述）。
      #
      # 最后一步会真实启动 dev server 请求首页与一个 API 路由：`bun run build` 只编译
      # 生产图谱，开发图谱里把 node: 内置模块带进 edge 或浏览器产物的错误能绕开它，
      # 表现成页面 500；冒烟失败时打印编译日志。
      - name: Verify (typecheck, tests, coverage, build, dev smoke)
        # 堆叠 PR 的合并目标是上一层分支，覆盖率门禁按同一个合并目标算改动清单：
        # 只看本 PR 自己的增量，不把上一层引入的文件重复判一遍。推到 main 时 base_ref
        # 为空，退回 origin/main。
        env:
          COVERAGE_GATE_BASE: origin/${{ github.base_ref || 'main' }}
        run: bun run ci

      # 覆盖率产物随构建一起保留，事后可以拿同一份 lcov 复核报告里的数字。路径与
      # `lib/coverage-gate/test-command.ts` 里的 LCOV_PATH 一致，测试锁住这两处不脱节。
      # 判定失败时产物同样要留下，所以这里不看前一步的结论。
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: .tmp/coverage-gate/lcov.info
          retention-days: 7
          if-no-files-found: warn
