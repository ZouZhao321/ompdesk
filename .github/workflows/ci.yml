name: CI

# Guards the release pipeline: publish-npm.yml runs `bun install --frozen-lockfile`,
# so a pull request that changes package.json without refreshing bun.lock breaks the
# npm publish only after the tag has already been pushed. Catch it on the pull request.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    # 冒烟步骤自己会起 dev server，最坏情况下要在启动超时与两次请求超时后收尾；
    # 给 job 一个上限，避免挂起的进程一直占着 runner。
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # engines.bun requires >=1.3.14: the omp SDK ships TypeScript that
          # imports `bun:` builtins, so an older Bun cannot serve the API routes.
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build package
        run: bun run build

      # `bun run build` 只编译生产图谱。开发图谱里把 node: 内置模块带进 edge 或
      # 浏览器产物的错误能绕开它，表现成页面 500；这一步真实启动 dev server 并
      # 请求首页与一个 API 路由，失败时打印编译日志。
      - name: Smoke dev build
        run: bun run smoke:dev
